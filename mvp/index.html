<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>认知知识库 · MVP</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-soft: #eef2ff;
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #dc2626;
    --ok: #16a34a;
    --warn: #d97706;
    --border: #e5e7eb;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; padding-bottom: 80px; }
  .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 20px 18px 18px; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header .sub { font-size: 12px; opacity: .85; margin-top: 4px; }
  .progress-bar { background: rgba(255,255,255,.2); border-radius: 20px; height: 8px; margin-top: 12px; overflow: hidden; }
  .progress-bar .fill { background: #fff; height: 100%; border-radius: 20px; transition: width .4s; }
  .progress-meta { font-size: 11px; opacity: .9; margin-top: 6px; display: flex; justify-content: space-between; }

  .container { max-width: 560px; margin: 0 auto; padding: 14px; }
  .section { margin-bottom: 14px; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 6px 4px 10px; letter-spacing: .5px; }

  .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; transition: transform .1s; border: 1px solid var(--border); }
  .card:active { transform: scale(.98); }
  .card + .card { margin-top: 10px; }

  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .badge-cat { background: var(--primary-soft); color: var(--primary); margin-right: 6px; }
  .badge-round { background: #fef3c7; color: var(--warn); }
  .badge-due-today { background: #fee2e2; color: var(--danger); }
  .badge-overdue { background: #fca5a5; color: #fff; }

  .k-title { font-size: 16px; font-weight: 700; margin: 8px 0 4px; }
  .k-sub { font-size: 12px; color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 13px; }
  .btn { display: inline-block; background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-block { width: 100%; padding: 13px; font-size: 15px; }
  .btn-ghost { background: #fff; color: var(--primary); border: 1px solid var(--primary); }

  /* 学习浮层 */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; z-index: 50; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 22px 18px 28px; }
  .modal .m-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
  .modal .m-tag { font-size: 12px; color: var(--primary); font-weight: 700; }
  .modal .m-title { font-size: 20px; font-weight: 800; margin: 6px 0 4px; }
  .modal .m-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  .q-block { margin-bottom: 16px; }
  .q-label { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .q-text { font-size: 15px; background: var(--bg); border-radius: 10px; padding: 14px; }
  .q-hint { font-size: 12px; color: #9ca3af; margin-top: 6px; font-style: italic; }

  .answer-reveal { background: var(--primary-soft); border-left: 3px solid var(--primary); border-radius: 8px; padding: 12px 14px; margin-top: 10px; display: none; }
  .answer-reveal.show { display: block; }
  .answer-reveal .a-def { font-size: 14px; }
  .answer-reveal .a-plain { font-size: 14px; margin-top: 8px; color: #334155; }
  .answer-reveal .a-label { font-size: 11px; font-weight: 700; color: var(--primary); }

  .actions { margin-top: 18px; }
  .grade-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .grade-btn { border: none; border-radius: 10px; padding: 13px 6px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; }
  .grade-btn.forgot { background: var(--danger); }
  .grade-btn.remember { background: var(--warn); }
  .grade-btn.know { background: var(--ok); }

  .close-btn { position: absolute; top: 12px; right: 14px; background: #f3f4f6; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--muted); }

  .toast { position: fixed; top: 40%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.78); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 99; display: none; }
  .toast.show { display: block; }
</style>
</head>
<body>

<div class="header">
  <h1>🧠 认知知识库</h1>
  <div class="sub" id="headerDate"></div>
  <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-meta">
    <span id="progressText">已学 0 / 0</span>
    <span id="masteredText">能讲 0</span>
  </div>
</div>

<div class="container">
  <!-- 今日复习 -->
  <div class="section" id="reviewSection">
    <div class="section-title">🔁 今日到期复习</div>
    <div id="reviewList"></div>
  </div>

  <!-- 今日新学 -->
  <div class="section" id="newSection">
    <div class="section-title">🆕 今日新学（沿课程路径）</div>
    <div id="newList"></div>
  </div>

  <!-- 知识库全览 -->
  <div class="section">
    <div class="section-title">📚 全库浏览</div>
    <div style="margin: 0 4px;">
      <button class="btn btn-ghost btn-block" onclick="renderAll()">展开全部知识点</button>
    </div>
    <div id="allList"></div>
  </div>
</div>

<!-- 学习浮层 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="m-handle"></div>
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="m-tag" id="mTag"></div>
    <div class="m-title" id="mTitle"></div>
    <div class="m-sub" id="mSub"></div>
    <div id="mBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="scheduler.js"></script>
<script>
  let STATE = loadState();
  let currentItemId = null;

  const catLabel = c => (CATEGORY_META[c] || {}).label || c;

  // —— 初始化头部 ——
  function initHeader() {
    const now = new Date();
    const week = ['日','一','二','三','四','五','六'][now.getDay()];
    document.getElementById('headerDate').textContent =
      `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${week}`;
    refreshProgress();
  }
  function refreshProgress() {
    const p = courseProgress(STATE);
    const pct = Math.round(p.learned / p.total * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `已学 ${p.learned} / ${p.total}`;
    document.getElementById('masteredText').textContent = `能讲 ${p.mastered}`;
  }

  // —— 渲染今日复习 ——
  function renderReview() {
    const due = dueItems(STATE);
    const box = document.getElementById('reviewList');
    if (due.length === 0) {
      box.innerHTML = '<div class="empty">今天没有到期复习 ✅</div>';
      return;
    }
    box.innerHTML = due.map(k => {
      const s = STATE[k.id];
      const overdue = daysUntil(s.nextReview) < 0;
      const badge = overdue ? '<span class="badge badge-overdue">逾期</span>' : '<span class="badge badge-due-today">今天到期</span>';
      return `
        <div class="card" onclick="openCard('${k.id}', 'review')">
          <div>
            <span class="badge badge-cat">${catLabel(k.cat)}</span>
            <span class="badge badge-round">${ROUND_NAMES[s.roundIndex]}</span>
            ${badge}
          </div>
          <div class="k-title">${k.name}</div>
          <div class="k-sub">下次复习：${s.nextReview} · 掌握度 ${MASTERY_NAMES[s.mastery]}</div>
        </div>`;
    }).join('');
  }

  // —— 渲染今日新学 ——
  function renderNew() {
    const next = nextNewItem(STATE);
    const box = document.getElementById('newList');
    if (!next) {
      box.innerHTML = '<div class="empty">🎉 全部知识点已学完！走一遍复习循环巩固。</div>';
      return;
    }
    const mod = COURSE_MAP.find(m => m.id === next.module);
    box.innerHTML = `
      <div class="card" onclick="openCard('${next.id}', 'learn')">
        <div>
          <span class="badge badge-cat">${catLabel(next.cat)}</span>
          <span class="badge badge-cat">${mod ? mod.name : ''}</span>
        </div>
        <div class="k-title">${next.name}</div>
        <div class="k-sub">${next.title || '点击开始学习'}</div>
      </div>`;
  }

  // —— 全库浏览 ——
  function renderAll() {
    const box = document.getElementById('allList');
    const sorted = [...KNOWLEDGE].sort((a,b) => a.module - b.module);
    let html = '<div style="margin-top:10px">';
    let curMod = -1;
    for (const k of sorted) {
      if (k.module !== curMod) {
        curMod = k.module;
        const mod = COURSE_MAP.find(m => m.id === curMod);
        html += `<div class="section-title" style="margin-top:12px">${mod ? mod.name : '模块'+curMod}</div>`;
      }
      const s = STATE[k.id];
      const status = s
        ? `<span class="badge badge-round">${ROUND_NAMES[s.roundIndex]} · ${MASTERY_NAMES[s.mastery]}</span>`
        : '<span class="badge" style="background:#f3f4f6;color:#9ca3af">未学</span>';
      const hasContent = k.def && k.plain;
      html += `
        <div class="card" onclick="${s ? `openCard('${k.id}','review')` : (hasContent ? `openCard('${k.id}','learn')` : `learnAnyway('${k.id}')`)}">
          <div><span class="badge badge-cat">${catLabel(k.cat)}</span>${status}</div>
          <div class="k-title">${k.name}</div>
          <div class="k-sub">${k.title || ''}</div>
        </div>`;
    }
    html += '</div>';
    box.innerHTML = html;
  }

  // —— 打开学习卡 ——
  function openCard(id, mode) {
    currentItemId = id;
    const k = KNOWLEDGE.find(x => x.id === id);
    const mod = COURSE_MAP.find(m => m.id === k.module);
    document.getElementById('mTag').textContent = `${catLabel(k.cat)} · ${mod ? mod.name : ''}`;
    document.getElementById('mTitle').textContent = k.name;
    document.getElementById('mSub').textContent = k.title || '';

    const hasContent = k.def && k.plain;
    const body = document.getElementById('mBody');
    const isLearn = (mode === 'learn') || !STATE[id];

    if (hasContent) {
      // 先显示问题（专有名词）→ 揭晓答案（定义+白话）
      body.innerHTML = `
        <div class="q-block">
          <div class="q-label">📖 请先回忆：这个术语是什么？</div>
          <button class="btn btn-block" onclick="revealAnswer()">揭晓答案</button>
          <div class="answer-reveal" id="answerBox">
            <div class="a-label">【专有定义】</div>
            <div class="a-def">${k.def}</div>
            <div class="a-label" style="margin-top:10px">【白话比喻】</div>
            <div class="a-plain">${k.plain}</div>
          </div>
        </div>
        <div class="actions">
          ${isLearn ? '<button class="btn btn-block" id="markLearnedBtn" onclick="finishLearn()">标记已学，进入复习队列</button>' : ''}
          ${!isLearn ? `
            <div class="q-label" style="margin-top:8px">这次回忆得怎么样？</div>
            <div class="grade-btns">
              <button class="grade-btn forgot" onclick="grade('forgot')">忘了</button>
              <button class="grade-btn remember" onclick="grade('remember')">记得</button>
              <button class="grade-btn know" onclick="grade('know')">能讲</button>
            </div>` : ''}
        </div>`;
    } else {
      // 内容待填
      body.innerHTML = `
        <div class="empty" style="padding:20px">
          该知识点「${k.name}」的专有定义与白话内容尚未录入。<br><br>
          这是 MVP 骨架阶段：先把学习路径 + 复习调度跑通，<br>内容会随着每日内参逐步填充。
        </div>
        <div class="actions">
          ${isLearn ? '<button class="btn btn-block" onclick="finishLearn()">跳过内容，标记已学</button>' : ''}
        </div>`;
    }
    document.getElementById('modal').classList.add('show');
  }

  function revealAnswer() {
    document.getElementById('answerBox').classList.add('show');
  }

  function finishLearn() {
    learnItem(STATE, currentItemId);
    saveState(STATE);
    refreshProgress();
    closeModal();
    renderReview(); renderNew();
    showToast('✅ 已加入复习队列，明天到期');
  }

  function grade(g) {
    reviewItem(STATE, currentItemId, g);
    saveState(STATE);
    refreshProgress();
    closeModal();
    renderReview(); renderNew();
    const msg = g === 'forgot' ? '已重置回 R1' : (g === 'remember' ? '已推进到下一档' : '很棒，已跳级');
    showToast(msg);
  }

  function learnAnyway(id) { openCard(id, 'learn'); }
  function closeModal() { document.getElementById('modal').classList.remove('show'); currentItemId = null; }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1200);
  }

  // —— 启动 ——
  initHeader();
  renderReview();
  renderNew();
</script>
</body>
</html>
