<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>认知知识库 · 有灵魂版</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --primary:#4f46e5; --primary-soft:#eef2ff; --text:#1f2937; --muted:#6b7280; --danger:#dc2626; --ok:#16a34a; --warn:#d97706; --border:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; line-height:1.6; padding-bottom:80px; }
  .header { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; padding:20px 18px; }
  .header h1 { font-size:18px; font-weight:800; }
  .header .sub { font-size:12px; opacity:.85; margin-top:4px; }
  .container { max-width:560px; margin:0 auto; padding:14px; }
  .section-title { font-size:13px; font-weight:700; color:var(--muted); margin:6px 4px 10px; }
  .card { background:var(--card); border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer; border:1px solid var(--border); }
  .card + .card { margin-top:10px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; }
  .badge-cat { background:var(--primary-soft); color:var(--primary); margin-right:6px; }
  .badge-round { background:#fef3c7; color:var(--warn); }
  .badge-due { background:#fee2e2; color:var(--danger); }
  .k-title { font-size:16px; font-weight:700; margin:8px 0 4px; }
  .k-sub { font-size:12px; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:26px 10px; font-size:13px; }
  .btn { background:var(--primary); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-block { width:100%; padding:13px; font-size:15px; }
  .btn-ghost { background:#fff; color:var(--primary); border:1px solid var(--primary); }

  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:50; }
  .modal-mask.show { display:flex; }
  .modal { background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:22px 18px 28px; }
  .modal .m-handle { width:36px; height:4px; background:#ddd; border-radius:2px; margin:0 auto 16px; }
  .modal .m-title { font-size:20px; font-weight:800; margin:6px 0 4px; }
  .modal .m-sub { font-size:12px; color:var(--muted); margin-bottom:14px; }

  .block-label { font-size:12px; font-weight:700; color:var(--primary); margin:14px 0 6px; }
  .block-text { font-size:15px; background:var(--bg); border-radius:10px; padding:13px; }
  .plain-box { background:var(--primary-soft); border-left:3px solid var(--primary); border-radius:8px; padding:12px 14px; font-size:14px; }

  .quiz-option { display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; margin-top:8px; font-size:14px; cursor:pointer; }
  .quiz-option.sel { border-color:var(--primary); background:var(--primary-soft); }
  .quiz-option.right { border-color:var(--ok); background:#f0fdf4; }
  .quiz-option.wrong { border-color:var(--danger); background:#fef2f2; }

  .gen-box textarea { width:100%; min-height:100px; border:1.5px solid var(--border); border-radius:10px; padding:12px; font-size:14px; font-family:inherit; }
  .actions { margin-top:16px; }
  .close-btn { float:right; background:#f3f4f6; border:none; width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer; color:var(--muted); }
  .toast { position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.8); color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; z-index:99; display:none; }
  .toast.show { display:block; }
  .spin { text-align:center; color:var(--muted); padding:20px; font-size:13px; }
</style>
</head>
<body>

<div class="header">
  <h1>🧠 认知知识库</h1>
  <div class="sub" id="headerDate"></div>
</div>

<div class="container">
  <div class="section-title">🔁 今日到期复习</div>
  <div id="reviewList"></div>

  <div class="section-title" style="margin-top:16px">🆕 今日新学（沿课程路径）</div>
  <div id="newList"></div>

  <div class="section-title" style="margin-top:16px">📚 知识库</div>
  <button class="btn btn-ghost btn-block" onclick="loadAll()">展开全部</button>
  <div id="allList"></div>
</div>

<div class="modal-mask" id="modal"><div class="modal"><div id="mBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const API = '';
let STATE = null;
let currentItem = null;
let selectedOption = null;

const CAT = { M:'思维模型', F:'分析框架', C:'社科经典', T:'术语白话卡', G:'国际格局', P:'国家政策' };
const ROUND = ['R1','R2','R3','R4','R5','R6','长期'];
const MASTERY = ['陌生','眼熟','理解','会用','能讲'];

async function fetchJSON(path, opts) {
  const r = await fetch(API + path, Object.assign({ headers:{'Content-Type':'application/json'} }, opts));
  return r.json();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }

async function loadState() {
  const d = await fetchJSON('/api/state');
  STATE = d;
  const now = new Date();
  const week = ['日','一','二','三','四','五','六'][now.getDay()];
  document.getElementById('headerDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${week}`;
  renderReview(); renderNew();
}

function renderReview() {
  const box = document.getElementById('reviewList');
  const dueIds = STATE.due || [];
  if (dueIds.length === 0) { box.innerHTML = '<div class="empty">今天没有到期复习 ✅</div>'; return; }
  box.innerHTML = dueIds.map(id => {
    const k = findK(id); const s = STATE.progress[id];
    return `<div class="card" onclick="openLearn('${id}')">
      <div><span class="badge badge-cat">${CAT[k.cat]}</span><span class="badge badge-due">到期</span><span class="badge badge-round">${ROUND[s.roundIndex]}</span></div>
      <div class="k-title">${k.name}</div>
      <div class="k-sub">掌握度 ${MASTERY[s.mastery]} · 下次 ${s.nextReview}</div>
    </div>`;
  }).join('');
}

function renderNew() {
  const box = document.getElementById('newList');
  const id = STATE.nextNew;
  if (!id) { box.innerHTML = '<div class="empty">🎉 全部学完</div>'; return; }
  const k = findK(id);
  box.innerHTML = `<div class="card" onclick="openLearn('${id}')">
    <div><span class="badge badge-cat">${CAT[k.cat]}</span></div>
    <div class="k-title">${k.name}</div>
    <div class="k-sub">${k.title || '点击开始学习'}</div>
  </div>`;
}

async function loadAll() {
  const box = document.getElementById('allList');
  const r = await fetchJSON('/api/state');
  const sorted = Object.values(r.progress);
  // 从后端拿全知识点顺序：遍历 progress 的 key 按模块排
  const ids = Object.keys(r.progress).sort();
  box.innerHTML = ids.map(id => {
    const k = findK(id); const s = r.progress[id];
    const status = s ? `<span class="badge badge-round">${ROUND[s.roundIndex]}·${MASTERY[s.mastery]}</span>` : '<span class="badge" style="background:#f3f4f6;color:#9ca3af">未学</span>';
    return `<div class="card" onclick="openLearn('${id}')"><div><span class="badge badge-cat">${CAT[k.cat]}</span>${status}</div><div class="k-title">${k.name}</div><div class="k-sub">${k.title||''}</div></div>`;
  }).join('');
}

function findK(id) {
  // 从后端 /api/state 拿不到 KNOWLEDGE 全表，通过一个全局知识表
  return (window.KNOWLEDGE_MAP || {})[id] || { id, name:id, cat:'?', title:'' };
}

async function openLearn(id) {
  currentItem = id;
  const s = STATE.progress[id];
  const k = findK(id);
  const modal = document.getElementById('modal');
  const body = document.getElementById('mBody');
  const hasContent = s && s.content;

  body.innerHTML = `<button class="close-btn" onclick="closeModal()">✕</button>
    <div class="m-sub">${CAT[k.cat] || ''}</div>
    <div class="m-title">${k.name}</div><div class="k-sub">${k.title||''}</div>`;

  if (hasContent) {
    const c = s.content;
    body.innerHTML += `
      <div class="block-label">📖 专有定义</div><div class="block-text">${c.definition||''}</div>
      <div class="block-label">💬 白话比喻</div><div class="plain-box">${c.plain||''}</div>
      ${c.example ? `<div class="block-label">🔍 现实案例</div><div class="block-text">${c.example||''}</div>` : ''}
      ${c.antiIntuition ? `<div class="block-label">⚠️ 反直觉点</div><div class="block-text">${c.antiIntuition||''}</div>` : ''}
      ${c.question ? `<div class="block-label">✏️ 随堂小测</div><div class="block-text">${c.question}</div><div id="opts"></div>` : ''}
      <div class="actions" id="reviewActions"></div>`;
    if (c.question && c.options) {
      renderOptions(c);
    }
    renderReviewActions(!!s && s.roundIndex !== undefined);
  } else {
    // 无内容：显示「生成」输入框（MVP：手动贴材料 or 我先代抓）
    body.innerHTML += `
      <div class="gen-box">
        <div class="block-label">🎯 这个知识点还没有内容</div>
        <div class="k-sub" style="margin-bottom:8px">贴一段原始材料（新闻/资料），AI 会按「先专有后白话」生成知识卡和题</div>
        <textarea id="material" placeholder="例如：2026年9月22日云栖大会…"></textarea>
        <button class="btn btn-block" style="margin-top:10px" onclick="genContent('${id}')">🤖 AI 生成</button>
      </div>`;
  }
  modal.classList.add('show');
}

function renderOptions(c) {
  const box = document.getElementById('opts');
  box.innerHTML = c.options.map((o, i) => `<button class="quiz-option" id="opt${i}" onclick="pickOpt(${i})">${o}</button>`).join('');
}

function pickOpt(i) {
  selectedOption = i;
  const c = currentItem && STATE.progress[currentItem] && STATE.progress[currentItem].content;
  if (!c) return;
  document.querySelectorAll('.quiz-option').forEach((el, idx) => {
    el.classList.remove('sel','right','wrong');
    if (idx === i) el.classList.add('sel');
  });
}

function renderReviewActions(alreadyLearned) {
  const box = document.getElementById('reviewActions');
  if (!alreadyLearned) {
    box.innerHTML = '<button class="btn btn-block" onclick="submitAnswer()">提交答案并标记已学</button>';
  } else {
    box.innerHTML = `
      <div class="block-label">这次回忆得怎么样？</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <button class="btn" style="background:var(--danger)" onclick="review('forgot')">忘了</button>
        <button class="btn" style="background:var(--warn)" onclick="review('remember')">记得</button>
        <button class="btn" style="background:var(--ok)" onclick="review('know')">能讲</button>
      </div>`;
  }
}

async function submitAnswer() {
  const c = STATE.progress[currentItem] && STATE.progress[currentItem].content;
  document.getElementById('reviewActions').innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
    <button class="btn" style="background:var(--danger)" onclick="review('forgot')">忘了</button>
    <button class="btn" style="background:var(--warn)" onclick="review('remember')">记得</button>
    <button class="btn" style="background:var(--ok)" onclick="review('know')">能讲</button></div>`;
  if (c && selectedOption !== null) {
    const correct = selectedOption === c.answer;
    await fetchJSON('/api/answer', { method:'POST', body:JSON.stringify({ id: currentItem, correct }) });
    // 高亮对错
    document.querySelectorAll('.quiz-option').forEach((el, idx) => {
      if (idx === c.answer) el.classList.add('right');
      if (idx === selectedOption && !correct) el.classList.add('wrong');
    });
    toast(correct ? '✅ 答对了' : '❌ 答错了，已记录，会强化复习');
  } else if (!c || !c.question) {
    await fetchJSON('/api/learn', { method:'POST', body:JSON.stringify({ id: currentItem }) });
    toast('已标记学习');
  }
  await loadState(); renderReview(); renderNew();
}

async function review(grade) {
  await fetchJSON('/api/review', { method:'POST', body:JSON.stringify({ id: currentItem, grade }) });
  closeModal();
  await loadState();
  toast(grade==='forgot'?'已重置R1':(grade==='remember'?'已推进':'很棒，跳级'));
}

async function genContent(id) {
  const raw = document.getElementById('material').value.trim();
  if (!raw) { toast('请先粘贴材料'); return; }
  const box = document.getElementById('mBody');
  box.innerHTML += '<div class="spin">🤖 AI 正在生成…</div>';
  const r = await fetchJSON('/api/generate', { method:'POST', body:JSON.stringify({ id, rawMaterial: raw }) });
  if (r.error) { toast('生成失败：'+r.error); box.innerHTML = ''; openLearn(id); return; }
  await loadState();
  openLearn(id);
}

function closeModal(){ document.getElementById('modal').classList.remove('show'); selectedOption=null; }

// 启动
(async function init() {
  // 从后端拉一次知识表
  try { const r = await fetch('/api/knowledge'); window.KNOWLEDGE_MAP = await r.json(); } catch(e) { window.KNOWLEDGE_MAP = {}; }
  await loadState();
})();
</script>
</body>
</html>
